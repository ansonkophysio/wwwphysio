<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="收下巴：把下巴向後收">
  <rect width="480" height="360" rx="28" fill="#eef2fa"/>
  <rect x="130" y="250" width="200" height="150" rx="70" fill="#7f97c4"/>
  <rect x="206" y="196" width="40" height="70" rx="18" fill="#e8c3a5"/>
  <!-- before: head forward (dashed) -->
  <circle cx="306" cy="156" r="56" fill="#ffffff" fill-opacity="0.6" stroke="#3a5899" stroke-width="5" stroke-dasharray="12 10"/>
  <!-- after: head tucked back -->
  <circle cx="232" cy="150" r="56" fill="#e8c3a5"/>
  <path d="M176 152 a56 56 0 0 1 108 -32 q-38 -2 -60 12 q-24 14 -48 20 z" fill="#1b2740"/>
  <circle cx="266" cy="152" r="5" fill="#1b2740"/>
  <circle cx="288" cy="166" r="9" fill="#e8c3a5"/>
  <!-- arrow back -->
  <path d="M372 64 L296 64" stroke="#1b2740" stroke-width="8" stroke-linecap="round"/>
  <path d="M312 48 L292 64 L312 80" fill="none" stroke="#1b2740" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
